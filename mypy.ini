[mypy]
python_version = 3.11
files = app
# Проверяем и тела функций без аннотаций - иначе непроаннотированная функция
# становится слепой зоной целиком.
check_untyped_defs = True
warn_return_any = True
warn_unused_ignores = True
warn_redundant_casts = True
# Аннотации обязательны: непроаннотированная сигнатура отдаёт вызывающему Any,
# и проверка глохнет по всей цепочке дальше, а не только внутри самой функции.
disallow_untyped_defs = True
disallow_incomplete_defs = True

# Библиотеки без type hints и без stub-пакетов.
[mypy-fastapi_limiter.*]
ignore_missing_imports = True

[mypy-aio_pika.*]
ignore_missing_imports = True

[mypy-prometheus_fastapi_instrumentator.*]
ignore_missing_imports = True
