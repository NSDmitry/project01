services:
  db:
    image: postgres:16
    container_name: project1_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    # Слушаем только на loopback - БД не торчит в сеть. Доступ приложения идёт
    # по внутренней docker-сети, порт наружу не нужен.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: project1_redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: nsdmitrij/project01:latest
    container_name: project1_migrate
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    working_dir: /app
    command: alembic upgrade head

  app:
    image: nsdmitrij/project01:latest
    container_name: project1_app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    working_dir: /app

  cleanup:
    image: nsdmitrij/project01:latest
    container_name: project1_cleanup
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    working_dir: /app
    command: >
      sh -c "while true; do
               now=$$(date +%s);
               next=$$(date -d 'today 03:00' +%s);
               [ $$next -le $$now ] && next=$$(date -d 'tomorrow 03:00' +%s);
               sleep $$((next - now));
               python -m app.iam.tasks;
             done"

volumes:
  postgres_data: