services:
  db:
    image: postgres:17
    container_name: project1_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    # Слушаем только на loopback - БД не торчит в сеть. Доступ приложения идёт
    # по внутренней docker-сети, порт наружу не нужен.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: project1_redis
    restart: always
    # Только loopback - наружу не торчит. Нужен для локального запуска приложения
    # на хосте (run.sh) и для контейнера app по внутренней сети.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: project1_minio
    restart: always
    # Обложки клубов и аватары пользователей. Бакет приватный - наружу картинки
    # раздаёт приложение (GET /media/<ключ>), поэтому порт только на loopback.
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Одноразовый контейнер: создаёт бакет, если его ещё нет. Приложение бакет не
  # создаёт - в проде ключ доступа такого права может и не иметь.
  minio-init:
    image: minio/mc
    container_name: project1_minio_init
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
             mc mb --ignore-existing local/$${S3_BUCKET}"

  migrate:
    image: nsdmitrij/project01:latest
    container_name: project1_migrate
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    working_dir: /app
    command: alembic upgrade head

  app:
    image: nsdmitrij/project01:latest
    container_name: project1_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    # Только loopback - наружу приложение отдаёт reverse-proxy (nginx/caddy) с TLS,
    # uvicorn голым в интернет не торчит.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    working_dir: /app

  caddy:
    image: caddy:2-alpine
    container_name: project1_caddy
    restart: unless-stopped
    depends_on:
      - app
    # 80 нужен для ACME-челленджа Let's Encrypt, 443 - сам HTTPS.
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # caddy_data хранит выданные сертификаты - без него при каждом рестарте
      # перевыпуск и упор в rate limit Let's Encrypt.
      - caddy_data:/data
      - caddy_config:/config

  cleanup:
    image: nsdmitrij/project01:latest
    container_name: project1_cleanup
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    working_dir: /app
    command: >
      sh -c "while true; do
               now=$$(date +%s);
               next=$$(date -d 'today 03:00' +%s);
               [ $$next -le $$now ] && next=$$(date -d 'tomorrow 03:00' +%s);
               sleep $$((next - now));
               python -m app.iam.tasks;
             done"

  notifier:
    image: nsdmitrij/project01:latest
    container_name: project1_notifier
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    working_dir: /app
    # Relay уведомлений раз в минуту: генерирует напоминания о дедлайнах и
    # передаёт накопившееся из notifications батчем в notification-service
    # (см. app/notifications/tasks.py). Доставку выполняет notification-worker.
    command: >
      sh -c "while true; do
               python -m app.notifications.tasks;
               sleep 60;
             done"

  # --- notification-service: отдельный сервис доставки со своей БД ---

  notifications-db:
    image: postgres:17
    container_name: project1_notifications_db
    restart: always
    environment:
      POSTGRES_USER: ${NOTIFICATIONS_POSTGRES_USER:?set NOTIFICATIONS_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${NOTIFICATIONS_POSTGRES_PASSWORD:?set NOTIFICATIONS_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${NOTIFICATIONS_POSTGRES_DB:?set NOTIFICATIONS_POSTGRES_DB in .env}
    # Порт наружу не публикуем: БД нужна только контейнерам сервиса по внутренней сети.
    volumes:
      - notifications_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFICATIONS_POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  notification-migrate:
    build: ./notification_service
    container_name: project1_notification_migrate
    depends_on:
      notifications-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${NOTIFICATIONS_POSTGRES_USER}:${NOTIFICATIONS_POSTGRES_PASSWORD}@notifications-db:5432/${NOTIFICATIONS_POSTGRES_DB}
    command: alembic upgrade head

  # Приём батчей от relay монолита. Наружу не публикуется - только внутренняя сеть.
  notification-service:
    build: ./notification_service
    container_name: project1_notification_service
    restart: unless-stopped
    depends_on:
      notifications-db:
        condition: service_healthy
      notification-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${NOTIFICATIONS_POSTGRES_USER}:${NOTIFICATIONS_POSTGRES_PASSWORD}@notifications-db:5432/${NOTIFICATIONS_POSTGRES_DB}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Доставка по каналам раз в минуту (см. notification_service/service/worker.py).
  # TELEGRAM_BOT_TOKEN для отправки живёт здесь; у монолита тот же токен остаётся
  # только ради проверки подписи Telegram initData при логине (IAM).
  notification-worker:
    build: ./notification_service
    container_name: project1_notification_worker
    restart: always
    depends_on:
      notifications-db:
        condition: service_healthy
      notification-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${NOTIFICATIONS_POSTGRES_USER}:${NOTIFICATIONS_POSTGRES_PASSWORD}@notifications-db:5432/${NOTIFICATIONS_POSTGRES_DB}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    command: >
      sh -c "while true; do
               python -m service.worker;
               sleep 60;
             done"

volumes:
  postgres_data:
  notifications_postgres_data:
  minio_data:
  caddy_data:
  caddy_config: