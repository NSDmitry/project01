[project]
name = "notification-service"
version = "0.1.0"
description = "Доставка уведомлений: приём батчей от монолита, очередь deliveries, каналы"
requires-python = ">=3.11"
dependencies = [
    "fastapi~=0.116.0",
    "starlette~=0.47.2",
    "uvicorn~=0.34.0",
    "SQLAlchemy~=2.0.37",
    "asyncpg~=0.30.0",
    "psycopg2-binary~=2.9.10",
    "alembic~=1.14.1",
    "pydantic-settings~=2.9.1",
    "httpx~=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3.5",
    "pytest-asyncio~=1.3.0",
    "mypy~=1.13",
]

[tool.setuptools]
packages = ["service"]
