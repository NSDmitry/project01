name: Run Tests on PR

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # До Postgres и pytest: ошибка типов валит прогон за полминуты, а не за три.
      # Проверяются оба проекта: монолит и notification_service (у каждого свой mypy.ini).
      - name: Check types
        run: |
          mypy
          (cd notification_service && mypy)

      - name: Start Postgres with Docker Compose
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for Postgres to be ready
        run: |
          until docker exec $(docker ps -qf "ancestor=postgres:15") pg_isready -U test_admin; do
            echo "Waiting for postgres..."
            sleep 2
          done

      - name: Run monolith tests
        env:
          IS_TEST: "true"
          TEST_DATABASE_URL: "postgresql://test_admin:test_password@localhost:5433/test_database"
        run: |
          pytest -v -s

      # Тот же Postgres на 5433: отдельную БД test_notifications тесты создают сами.
      - name: Run notification-service tests
        working-directory: notification_service
        env:
          IS_TEST: "true"
        run: pytest -v -s

      - name: Shutdown Docker Compose
        if: always()
        run: docker compose -f docker-compose.test.yml down